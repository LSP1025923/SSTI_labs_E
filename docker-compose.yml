# =============================================================================
# SSTI_labs_E —— 根编排：一次起全部靶场
#
# 设计约定（本仓库的核心）：
#   * **一个靶场 = 一个独立容器 + 一个独立镜像 + 一个独立端口**；
#   * 所有 Python 靶场共享同一份 `shared/ssti_core` 代码与**同一个前端构建产物**
#     （`ssti-frontend:local`），但各自构建、各自运行，互不影响；
#   * flag 一律由 entrypoint 从环境变量写入 `/flag`，**不进镜像层**；
#   * 需要「不出网」的靶场（07、08）通过 `cap_add: NET_ADMIN` +
#     entrypoint 里的 iptables 规则真正切断出网。
#
# ⚠️ 首次使用前必须先构建前端镜像（各靶场 Dockerfile 会用 named stage 引用它）：
#       scripts/build-frontend.sh          # Linux/macOS
#       scripts\build-frontend.ps1         # Windows
#    或者直接：docker compose build frontend-build
#    推荐用一键脚本，它会自动处理这个顺序：
#       scripts/up-all.sh  /  scripts\up-all.ps1
#
# 用法：
#   docker compose up -d                      # 起 01–07（不含 Java，见下）
#   docker compose up -d jinja-chain          # 只起某一个
#   docker compose --profile java up -d       # 额外起 08（Java，首次构建较慢）
#   docker compose logs -f jinja-chain
#   docker compose down
#
# 单独起某一个靶场也可以（每个 labs/*/ 下都有自己的 docker-compose.yml）：
#   cd labs/02-jinja-chain && docker compose up --build
# =============================================================================

# ---------------------------------------------------------------- 公共片段
# flag 注入优先级：GZCTF_FLAG > DASFLAG > FLAG > STATIC_FLAG
x-flag-env: &flag-env
  GZCTF_FLAG: ${GZCTF_FLAG:-}
  DASFLAG: ${DASFLAG:-}
  FLAG: ${FLAG:-}
  RESET_TOKEN: ${RESET_TOKEN:-}

# Python 系靶场统一的健康检查（镜像里没有 curl，用 python 自带的 urllib）
x-py-healthcheck: &py-healthcheck
  test:
    - CMD-SHELL
    - >-
      python -c "import urllib.request,sys;
      sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:5000/healthz',timeout=3).status==200 else 1)"
  interval: 30s
  timeout: 5s
  retries: 3
  start_period: 10s

x-py-build: &py-build
  context: .
  args:
    FRONTEND_IMAGE: ${FRONTEND_IMAGE:-ssti-frontend:local}

services:
  # ---------------------------------------------------------------- 前端构建
  # 只构建、不常驻（CMD 是一条 ls）。各靶场的 Dockerfile 通过
  # `FROM ${FRONTEND_IMAGE} AS frontend` 引用它的产物 /app/build。
  frontend-build:
    build:
      context: ./frontend
    image: ssti-frontend:local
    profiles: ["build"]
    restart: "no"

  # ---------------------------------------------------------------- 01
  # 原版挑战：关键词表 WAF，Fenjing crack-keywords 考点
  jinja-waf-fenjing:
    build:
      <<: *py-build
      dockerfile: labs/01-jinja-waf-fenjing/Dockerfile
    image: ssti-jinja-waf-fenjing:local
    container_name: ssti-01-jinja-waf-fenjing
    ports:
      - "${JINJA_WAF_PORT:-8091}:5000"
    environment:
      <<: *flag-env
      LAB_ID: jinja-waf-fenjing
      STATIC_FLAG: ${STATIC_FLAG_JINJA_WAF:-flag{jinja_waf_fenjing}}
    healthcheck: *py-healthcheck
    restart: unless-stopped

  # ---------------------------------------------------------------- 02
  jinja-chain:
    build:
      <<: *py-build
      dockerfile: labs/02-jinja-chain/Dockerfile
    image: ssti-jinja-chain:local
    container_name: ssti-02-jinja-chain
    ports:
      - "${JINJA_CHAIN_PORT:-8092}:5000"
    environment:
      <<: *flag-env
      LAB_ID: jinja-chain
      STATIC_FLAG: ${STATIC_FLAG_JINJA_CHAIN:-flag{jinja_chain}}
    healthcheck: *py-healthcheck
    restart: unless-stopped

  # ---------------------------------------------------------------- 03
  mako-chain:
    build:
      <<: *py-build
      dockerfile: labs/03-mako-chain/Dockerfile
    image: ssti-mako-chain:local
    container_name: ssti-03-mako-chain
    ports:
      - "${MAKO_CHAIN_PORT:-8093}:5000"
    environment:
      <<: *flag-env
      LAB_ID: mako-chain
      STATIC_FLAG: ${STATIC_FLAG_MAKO_CHAIN:-flag{mako_chain}}
    healthcheck: *py-healthcheck
    restart: unless-stopped

  # ---------------------------------------------------------------- 04
  tornado-chain:
    build:
      <<: *py-build
      dockerfile: labs/04-tornado-chain/Dockerfile
    image: ssti-tornado-chain:local
    container_name: ssti-04-tornado-chain
    ports:
      - "${TORNADO_CHAIN_PORT:-8094}:5000"
    environment:
      <<: *flag-env
      LAB_ID: tornado-chain
      STATIC_FLAG: ${STATIC_FLAG_TORNADO_CHAIN:-flag{tornado_chain}}
    healthcheck: *py-healthcheck
    restart: unless-stopped

  # ---------------------------------------------------------------- 05
  jinja-sandbox:
    build:
      <<: *py-build
      dockerfile: labs/05-jinja-sandbox/Dockerfile
    image: ssti-jinja-sandbox:local
    container_name: ssti-05-jinja-sandbox
    ports:
      - "${JINJA_SANDBOX_PORT:-8095}:5000"
    environment:
      <<: *flag-env
      LAB_ID: jinja-sandbox
      STATIC_FLAG: ${STATIC_FLAG_JINJA_SANDBOX:-flag{jinja_sandbox_escape}}
    healthcheck: *py-healthcheck
    restart: unless-stopped

  # ---------------------------------------------------------------- 06
  blind-ssti:
    build:
      <<: *py-build
      dockerfile: labs/06-blind-ssti/Dockerfile
    image: ssti-blind:local
    container_name: ssti-06-blind-ssti
    ports:
      - "${BLIND_SSTI_PORT:-8096}:5000"
    environment:
      <<: *flag-env
      LAB_ID: blind-ssti
      STATIC_FLAG: ${STATIC_FLAG_BLIND:-flag{blind_ssti}}
      SSTI_ECHO_DIR: ${SSTI_ECHO_DIR:-/app/echo}
    healthcheck: *py-healthcheck
    restart: unless-stopped

  # ---------------------------------------------------------------- 07
  # 不出网：Flask 内存马
  flask-memshell:
    build:
      <<: *py-build
      dockerfile: labs/07-flask-memshell/Dockerfile
    image: ssti-flask-memshell:local
    container_name: ssti-07-flask-memshell
    ports:
      - "${FLASK_MEMSHELL_PORT:-8097}:5000"
    environment:
      <<: *flag-env
      LAB_ID: flask-memshell
      STATIC_FLAG: ${STATIC_FLAG_MEMSHELL:-flag{flask_memshell}}
      SSTI_NO_EGRESS: "1"
      SSTI_ECHO_DIR: ${SSTI_ECHO_DIR:-/app/echo}
    # 没有 NET_ADMIN 就装不了 iptables 规则，出网切不断（entrypoint 会告警）
    cap_add:
      - NET_ADMIN
    healthcheck: *py-healthcheck
    restart: unless-stopped

  # ---------------------------------------------------------------- 08
  # 不出网：Java（Spring Boot + FreeMarker/Thymeleaf → Tomcat 内存马）
  # 首次构建要拉 Maven 依赖，比较慢，所以放在 java profile 后面按需启用。
  # 注意它的 build context 是靶场目录本身（不需要 shared/ 与统一前端）。
  freemarker-memshell:
    profiles: ["java"]
    build:
      context: ./labs/08-freemarker-memshell
      dockerfile: Dockerfile
    image: ssti-freemarker-memshell:local
    container_name: ssti-08-freemarker-memshell
    ports:
      - "${FREEMARKER_MEMSHELL_PORT:-8098}:8080"
    environment:
      GZCTF_FLAG: ${GZCTF_FLAG:-}
      DASFLAG: ${DASFLAG:-}
      FLAG: ${FLAG:-}
      STATIC_FLAG: ${STATIC_FLAG_FREEMARKER:-flag{freemarker_memshell}}
      JAVA_OPTS: ${JAVA_OPTS:--Xms64m -Xmx256m -Dfile.encoding=UTF-8}
    cap_add:
      - NET_ADMIN
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O - http://127.0.0.1:8080/healthz || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 30
      start_period: 40s
    restart: unless-stopped
