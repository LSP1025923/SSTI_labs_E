server.port=8080
server.address=0.0.0.0
spring.application.name=theme-hub

# 模板引擎
spring.freemarker.enabled=true
spring.freemarker.prefix=classpath:/templates/freemarker/
spring.freemarker.suffix=.ftl
spring.freemarker.cache=false
spring.thymeleaf.cache=false
spring.thymeleaf.prefix=classpath:/templates/
spring.thymeleaf.suffix=.html
spring.mvc.view.prefix=
spring.mvc.view.suffix=

# 教学用：把异常信息原样吐给玩家，方便观察 payload 的对错
server.error.include-message=always
server.error.include-stacktrace=always
server.error.whitelabel.enabled=false

# 启动/请求日志安静一点，但保留 warning
logging.level.root=WARN
logging.level.com.lab.themepreview=INFO
logging.level.org.springframework.web.servlet.mvc.method.annotation.RequestMappingHandlerMapping=INFO
