# 单靶场独立环境：在本目录直接 `docker compose up --build` 即可（端口 8097）。
#
# 注意：build context 是仓库根目录，因为镜像需要 shared/ 公共库与统一前端产物。
# 首次启动前请先构建前端镜像：
#     ../../scripts/build-frontend.sh          # Linux/macOS
#     ..\..\scripts\build-frontend.ps1         # Windows
services:
  flask-memshell:
    build:
      context: ../..
      dockerfile: labs/07-flask-memshell/Dockerfile
      args:
        FRONTEND_IMAGE: ${FRONTEND_IMAGE:-ssti-frontend:local}
    image: ssti-flask-memshell:local
    container_name: ssti-flask-memshell
    ports:
      - "${FLASK_MEMSHELL_PORT:-8097}:5000"
    cap_add:
      - NET_ADMIN
    environment:
      LAB_ID: flask-memshell
      PORT: "5000"
      SSTI_NO_EGRESS: "1"
      # flag 优先级 GZCTF_FLAG > DASFLAG > FLAG > STATIC_FLAG
      GZCTF_FLAG: ${GZCTF_FLAG:-}
      DASFLAG: ${DASFLAG:-}
      FLAG: ${FLAG:-}
      STATIC_FLAG: ${STATIC_FLAG:-flag{flask_memshell}}
      RESET_TOKEN: ${RESET_TOKEN:-}
      SSTI_MAX_OUTPUT_CHARS: ${SSTI_MAX_OUTPUT_CHARS:-262144}
    restart: unless-stopped
