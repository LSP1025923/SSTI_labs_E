# 单靶场独立环境：在本目录直接 `docker compose up --build` 即可（端口 8093）。
#
# 注意：build context 是仓库根目录，因为镜像需要 shared/ 公共库与统一前端产物。
# 首次启动前请先构建前端镜像：
#     ../../scripts/build-frontend.sh          # Linux/macOS
#     ..\..\scripts\build-frontend.ps1         # Windows
services:
  mako-chain:
    build:
      context: ../..
      dockerfile: labs/03-mako-chain/Dockerfile
      args:
        FRONTEND_IMAGE: ${FRONTEND_IMAGE:-ssti-frontend:local}
    image: ssti-mako-chain:local
    container_name: ssti-mako-chain
    ports:
      - "${MAKO_CHAIN_PORT:-8093}:5000"
    environment:
      LAB_ID: mako-chain
      PORT: "5000"
      SSTI_NO_EGRESS: "0"
      # flag 优先级 GZCTF_FLAG > DASFLAG > FLAG > STATIC_FLAG
      GZCTF_FLAG: ${GZCTF_FLAG:-}
      DASFLAG: ${DASFLAG:-}
      FLAG: ${FLAG:-}
      STATIC_FLAG: ${STATIC_FLAG:-flag{mako_chain}}
      RESET_TOKEN: ${RESET_TOKEN:-}
      SSTI_MAX_OUTPUT_CHARS: ${SSTI_MAX_OUTPUT_CHARS:-262144}
    restart: unless-stopped
